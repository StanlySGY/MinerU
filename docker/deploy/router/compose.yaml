services:
  mineru-code-sync:
    image: ${MINERU_CODE_IMAGE:-mineru-code:v1.0}
    container_name: mineru-code-sync-router
    restart: "no"
    volumes:
      - mineru-code:/target

  mineru-router:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-router
    restart: always
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${ROUTER_PORT:-8002}:8002"
    environment:
      PYTHONPATH: /app
    volumes:
      - mineru-code:/app:ro
    entrypoint: ["python", "-m"]
    command:
      - mineru.cli.router
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --local-gpus
      - none
      - --allow-public-http-client
      - --upstream-url
      - http://${API_1_IP}:${API_1_PORT}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mineru-code:
    name: ${MINERU_CODE_VOLUME:-mineru-code}
