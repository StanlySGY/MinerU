# =============================================================================
# MinerU Router 部署配置
# =============================================================================
# 只启动 Router 负载均衡服务，API 和 VLM 由用户自行部署管理。
#
# 使用方式：
#   1. 复制 env.multi.example 为 env.multi，编辑 IP 和端口
#   2. docker compose -f compose-multi.yaml --env-file env.multi up -d
#
# 后续添加 API 后端：
#   修改 env.multi 中的 API_1_IP、API_1_PORT 等配置，
#   然后重启 Router：docker compose -f compose-multi.yaml --env-file env.multi up -d
# =============================================================================

services:

  # ===========================================================================
  # Router 负载均衡服务（唯一启用的服务）
  # ===========================================================================
  # 作用：接收所有用户请求，根据各 API 实例的负载情况智能分发
  # 策略：最少连接 + 随机化，自动剔除不健康的 API，故障自动转移
  # 访问地址：http://<服务器IP>:8002/docs
  # ===========================================================================
  mineru-router:
    image: mineru-full:v1.0
    container_name: mineru-router
    restart: always
    ports:
      # Router 对外端口（默认 8002）
      - ${ROUTER_PORT:-8002}:8002
    entrypoint: mineru-router
    command:
      --host 0.0.0.0
      --port 8002
      --local-gpus none
      # 下面是 Router 分发到的后端 API 地址（根据 env.multi 配置）
      --upstream-url http://${API_1_IP:-127.0.0.1}:${API_1_PORT:-18000}
      # --upstream-url http://${API_2_IP:-127.0.0.1}:${API_2_PORT:-18001}
      # --upstream-url http://${API_3_IP:-127.0.0.1}:${API_3_PORT:-18002}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

