# 当前现场部署：一个或多个外部 VLM + 一个或多个 mineru-api-* + 一个 Router。
# VLM 不由本文件创建，必须先在 VLM 主机上启动，并保证 API 容器可以访问它。
#
# 多节点扩容：复制对应 API 模板改成 mineru-api-N，环境变量用 VLM_N_IP/VLM_N_PORT/API_N_PORT，
# Router/Ops 主机通过 MINERU_ROUTER_UPSTREAM_URLS_JSON 接入已部署的远程 API。
# start-multi.sh 按 MINERU_DEPLOY_ROLE 和 MINERU_API_NODE_IDS 选择启动节点，并按 env.multi 检查 VLM。
#
# 本文件只包含与硬件无关的定义，可直接在 x86 / ARM 的纯 CPU 主机上启动。
# 需要加速卡时，由 start-multi.sh 按 env.multi 的 MINERU_DEVICE_MODE 追加叠加文件：
#   MINERU_DEVICE_MODE=npu  -> compose-multi.npu.yaml
#   MINERU_DEVICE_MODE=cuda -> compose-multi.nvidia.yaml
#   MINERU_DEVICE_MODE=cpu  -> 不追加任何叠加文件
services:
  mineru-code-sync:
    # 一次性把代码镜像复制到共享卷；Exited (0) 是正常结果。
    image: ${MINERU_CODE_IMAGE:-mineru-code:v3.4.2-ops-ui20}
    container_name: mineru-code-sync-multi
    restart: "no"
    labels:
      com.mineru.role: code-sync
    volumes:
      - mineru-code:/target

  mineru-api-1:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-1
    restart: always
    labels:
      com.mineru.role: api
      com.mineru.api.index: "1"
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_1_PORT:-6002}:8000"
    environment: &api-environment
      PYTHONPATH: /app
      # 这里填写 API 容器能访问的外部 VLM，不要填写 API 容器自己的 127.0.0.1。
      MINERU_VL_SERVER: "http://${VLM_1_IP:-127.0.0.1}:${VLM_1_PORT:-30000}/v1"
      MINERU_VLM_SERVER_URL: "http://${VLM_1_IP:-127.0.0.1}:${VLM_1_PORT:-30000}/v1"
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}
      # Pipeline/Hybrid 使用现场已经准备好的本地模型，不尝试联网下载。
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}
      MINERU_TOOLS_CONFIG_JSON: ${MINERU_TOOLS_CONFIG_JSON:-/etc/mineru/mineru.json}
      # cpu / npu / cuda 由 env.multi 配置；npu 和 cuda 还需要对应的叠加文件。
      MINERU_DEVICE_MODE: ${MINERU_DEVICE_MODE:-cpu}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-8}
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}
      MINERU_VLM_FAILURE_POLICY: ${MINERU_VLM_FAILURE_POLICY:-skip_page}
      MINERU_VLM_GLOBAL_PAGE_CONCURRENCY: ${MINERU_VLM_GLOBAL_PAGE_CONCURRENCY:-2}
      MINERU_VLM_PAGE_TIMEOUT_SECONDS: ${MINERU_VLM_PAGE_TIMEOUT_SECONDS:-600}
      MINERU_VLM_CONNECT_MAX_RETRIES: ${MINERU_VLM_CONNECT_MAX_RETRIES:-1}
      # /app 是只读代码目录，解析结果必须写入独立的可写目录。
      MINERU_API_OUTPUT_ROOT: ${MINERU_API_OUTPUT_ROOT:-/var/lib/mineru/output}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}
    volumes: &api-volumes
      - mineru-code:/app:ro
      # 独立输出卷，避免 API 尝试在只读的 /app/output 下创建目录。
      - mineru-api-output:/var/lib/mineru/output
      # 完整 PDF-Extract-Kit-1.0 模型目录；Pipeline 和 Hybrid 共用。
      - ${PIPELINE_MODEL_HOST_PATH:-./models/PDF-Extract-Kit-1.0}:/models/pipeline:ro
      # 配置中的 models-dir.pipeline 必须写成容器内路径 /models/pipeline。
      - ${PIPELINE_CONFIG_HOST_PATH:-./mineru.pipeline.json}:/etc/mineru/mineru.json:ro
    entrypoint: ["python", "-m"]
    command: &api-command
      - mineru.cli.fast_api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allow-public-http-client
      - --max-concurrency
      - ${MINERU_VLM_CLIENT_MAX_CONCURRENCY:-4}
      - --max-retries
      - ${MINERU_VLM_CLIENT_MAX_RETRIES:-0}
      - --http-timeout
      - ${MINERU_VLM_CLIENT_HTTP_TIMEOUT:-7200}
    healthcheck: &api-healthcheck
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4 个节点都定义在同一份文件中；start-multi.sh 通过 MINERU_API_NODE_IDS
  # 决定本机实际启动哪些节点，因此两台 API 主机可以复用该文件。
  mineru-api-2:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-2
    restart: always
    labels:
      com.mineru.role: api
      com.mineru.api.index: "2"
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_2_PORT:-6003}:8000"
    environment:
      <<: *api-environment
      MINERU_VL_SERVER: "http://${VLM_2_IP:-127.0.0.1}:${VLM_2_PORT:-30000}/v1"
      MINERU_VLM_SERVER_URL: "http://${VLM_2_IP:-127.0.0.1}:${VLM_2_PORT:-30000}/v1"
    volumes: *api-volumes
    entrypoint: ["python", "-m"]
    command: *api-command
    healthcheck: *api-healthcheck

  mineru-api-3:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-3
    restart: always
    labels:
      com.mineru.role: api
      com.mineru.api.index: "3"
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_3_PORT:-8001}:8000"
    environment:
      <<: *api-environment
      MINERU_VL_SERVER: "http://${VLM_3_IP:-127.0.0.1}:${VLM_3_PORT:-30000}/v1"
      MINERU_VLM_SERVER_URL: "http://${VLM_3_IP:-127.0.0.1}:${VLM_3_PORT:-30000}/v1"
    volumes: *api-volumes
    entrypoint: ["python", "-m"]
    command: *api-command
    healthcheck: *api-healthcheck

  mineru-api-4:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-4
    restart: always
    labels:
      com.mineru.role: api
      com.mineru.api.index: "4"
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_4_PORT:-8002}:8000"
    environment:
      <<: *api-environment
      MINERU_VL_SERVER: "http://${VLM_4_IP:-127.0.0.1}:${VLM_4_PORT:-30000}/v1"
      MINERU_VLM_SERVER_URL: "http://${VLM_4_IP:-127.0.0.1}:${VLM_4_PORT:-30000}/v1"
    volumes: *api-volumes
    entrypoint: ["python", "-m"]
    command: *api-command
    healthcheck: *api-healthcheck

  mineru-router:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-router
    restart: always
    labels:
      com.mineru.role: router
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${ROUTER_PORT:-8002}:8002"
    environment:
      PYTHONPATH: /app
      # 外部调用未显式传单页超时时，由 Router 使用配置中心的值并转发给 API。
      MINERU_VLM_PAGE_TIMEOUT_SECONDS: ${MINERU_VLM_PAGE_TIMEOUT_SECONDS:-600}
      # 外部调用未显式传连接重试次数时，由 Router 使用配置中心的值并转发给 API。
      MINERU_VLM_CONNECT_MAX_RETRIES: ${MINERU_VLM_CONNECT_MAX_RETRIES:-1}
      MINERU_ROUTER_UPSTREAM_URLS_JSON: '${MINERU_ROUTER_UPSTREAM_URLS_JSON:-["http://mineru-api-1:8000"]}'
    volumes:
      - mineru-code:/app:ro
    entrypoint: ["python", "-m"]
    command:
      - mineru.cli.router
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --local-gpus
      - none
      - --allow-public-http-client
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mineru-ops:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-ops
    restart: always
    labels:
      com.mineru.role: ops
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${MINERU_OPS_PORT:-19000}:19000"
    environment:
      PYTHONPATH: /app
      MINERU_OPS_DATA_DIR: /var/lib/mineru-ops
      MINERU_OPS_COMPOSE_CONFIG: /config/compose-config.yaml
      MINERU_OPS_TEST_ROOT: /data/mineru-test-pdfs
      MINERU_OPS_ROUTER_URL: http://mineru-router:8002
      MINERU_OPS_AGENT_SOCKET: /run/mineru-ops/agent.sock
      MINERU_OPS_BATCH_SCRIPT: /opt/mineru-ops/batch-router-diagnose.py
      MINERU_OPS_AUTH_TOKEN: ${MINERU_OPS_AUTH_TOKEN:-}
      MINERU_OPS_SMOKE_BACKEND: ${MINERU_OPS_SMOKE_BACKEND:-vlm-http-client}
      MINERU_OPS_SMOKE_TIMEOUT_SECONDS: ${MINERU_OPS_SMOKE_TIMEOUT_SECONDS:-900}
      MINERU_OPS_MAX_UPLOAD_MB: ${MINERU_OPS_MAX_UPLOAD_MB:-2048}
      MINERU_OPS_ARTIFACT_RETENTION_DAYS: ${MINERU_OPS_ARTIFACT_RETENTION_DAYS:-7}
      MINERU_OPS_ARTIFACT_MAX_GB: ${MINERU_OPS_ARTIFACT_MAX_GB:-50}
      MINERU_OPS_SAVE_RESULT_IMAGES: ${MINERU_OPS_SAVE_RESULT_IMAGES:-true}
      MINERU_OPS_BATCH_REAPER_INTERVAL_SECONDS: ${MINERU_OPS_BATCH_REAPER_INTERVAL_SECONDS:-30}
      MINERU_OPS_BATCH_ORPHAN_GRACE_SECONDS: ${MINERU_OPS_BATCH_ORPHAN_GRACE_SECONDS:-120}
      MINERU_OPS_BATCH_MAX_RUNTIME_SECONDS: ${MINERU_OPS_BATCH_MAX_RUNTIME_SECONDS:-86400}
      MINERU_OPS_TASK_RETENTION_DAYS: ${MINERU_OPS_TASK_RETENTION_DAYS:-7}
      MINERU_OPS_TASK_SYNC_INTERVAL_SECONDS: ${MINERU_OPS_TASK_SYNC_INTERVAL_SECONDS:-5}
      MINERU_OPS_TASK_FULL_SYNC_INTERVAL_SECONDS: ${MINERU_OPS_TASK_FULL_SYNC_INTERVAL_SECONDS:-300}
      # 控制台只展示本机实际角色和 Router upstream 中的远程 API 节点。
      MINERU_DEPLOY_ROLE: ${MINERU_DEPLOY_ROLE:-all}
      MINERU_API_NODE_IDS: ${MINERU_API_NODE_IDS:-1}
      MINERU_ROUTER_UPSTREAM_URLS_JSON: '${MINERU_ROUTER_UPSTREAM_URLS_JSON:-["http://mineru-api-1:8000"]}'
      MINERU_API_NODE_1_URL: ${MINERU_API_NODE_1_URL:-}
      MINERU_API_NODE_2_URL: ${MINERU_API_NODE_2_URL:-}
      MINERU_API_NODE_3_URL: ${MINERU_API_NODE_3_URL:-}
      MINERU_API_NODE_4_URL: ${MINERU_API_NODE_4_URL:-}
      TMPDIR: /var/lib/mineru-ops/tmp
    volumes:
      - mineru-code:/app:ro
      - ./.mineru-ops/compose-config.yaml:/config/compose-config.yaml:ro
      - ./.mineru-ops:/run/mineru-ops
      - ./batch-router-diagnose.py:/opt/mineru-ops/batch-router-diagnose.py:ro
      - ${MINERU_OPS_TEST_HOST_PATH:-./test-pdfs}:/data/mineru-test-pdfs:ro
      - mineru-ops-data:/var/lib/mineru-ops
    entrypoint: ["python", "-m"]
    command:
      - mineru.cli.ops
      - --host
      - 0.0.0.0
      - --port
      - "19000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mineru-code:
    name: ${MINERU_CODE_VOLUME:-mineru-code-multi}
  # API 任务输出和上传结果存放在这里，不随容器删除。
  mineru-api-output:
    name: ${MINERU_API_OUTPUT_VOLUME:-mineru-api-output-multi}
  mineru-ops-data:
    name: ${MINERU_OPS_DATA_VOLUME:-mineru-ops-data-multi}
