services:
  mineru-code-sync:
    image: ${MINERU_CODE_IMAGE:-mineru-code:v1.0}
    container_name: mineru-code-sync-multi
    restart: "no"
    volumes:
      - mineru-code:/target

  mineru-api-1:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-1
    restart: always
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_1_PORT:-18000}:8000"
    environment: &api-environment
      PYTHONPATH: /app
      MINERU_VL_SERVER: http://${VLM_1_IP}:${VLM_1_PORT}/v1
      MINERU_VLM_SERVER_URL: http://${VLM_1_IP}:${VLM_1_PORT}/v1
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-32}
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-3}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}
    volumes: &api-volumes
      - mineru-code:/app:ro
    entrypoint: ["python", "-m"]
    command: &api-command
      - mineru.cli.fast_api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allow-public-http-client
    healthcheck: &api-healthcheck
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mineru-api-2:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-2
    restart: always
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_2_PORT:-18001}:8000"
    environment:
      <<: *api-environment
      MINERU_VL_SERVER: http://${VLM_2_IP}:${VLM_2_PORT}/v1
      MINERU_VLM_SERVER_URL: http://${VLM_2_IP}:${VLM_2_PORT}/v1
    volumes: *api-volumes
    entrypoint: ["python", "-m"]
    command: *api-command
    healthcheck: *api-healthcheck

  mineru-api-3:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-api-3
    restart: always
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${API_3_PORT:-18002}:8000"
    environment:
      <<: *api-environment
      MINERU_VL_SERVER: http://${VLM_3_IP}:${VLM_3_PORT}/v1
      MINERU_VLM_SERVER_URL: http://${VLM_3_IP}:${VLM_3_PORT}/v1
    volumes: *api-volumes
    entrypoint: ["python", "-m"]
    command: *api-command
    healthcheck: *api-healthcheck

  mineru-router:
    image: ${MINERU_ENV_IMAGE:-mineru-env:v1.0}
    container_name: mineru-router
    restart: always
    depends_on:
      mineru-api-1:
        condition: service_healthy
      mineru-api-2:
        condition: service_healthy
      mineru-api-3:
        condition: service_healthy
    ports:
      - "${ROUTER_PORT:-8002}:8002"
    environment:
      PYTHONPATH: /app
    volumes:
      - mineru-code:/app:ro
    entrypoint: ["python", "-m"]
    command:
      - mineru.cli.router
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --local-gpus
      - none
      - --allow-public-http-client
      - --upstream-url
      - http://mineru-api-1:8000
      - --upstream-url
      - http://mineru-api-2:8000
      - --upstream-url
      - http://mineru-api-3:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mineru-code:
    name: ${MINERU_CODE_VOLUME:-mineru-code}
