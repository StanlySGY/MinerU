# =============================================================================
# MinerU 多卡部署配置
# =============================================================================
# 架构：Router（负载均衡入口）+ API（文档解析）+ 已有的 VLM Server
#
# 当前状态：
#   - 已启用：Router + API-1（指向已有的 VLM Server）
#   - VLM Server 由用户自行启动（不在本 compose 中管理）
#
# 使用方式：
#   1. 复制 env.multi.example 为 env.multi，编辑 IP 和端口
#   2. docker compose -f compose-multi.yaml --env-file env.multi up -d
# =============================================================================

services:

  # ===========================================================================
  # Router 负载均衡服务
  # ===========================================================================
  # 作用：接收所有用户请求，根据各 API 实例的负载情况智能分发
  # 策略：最少连接 + 随机化，自动剔除不健康的 API，故障自动转移
  # 访问地址：http://<服务器IP>:8002/docs
  # ===========================================================================
  mineru-router:
    image: mineru-full:v1.0
    container_name: mineru-router
    restart: always
    ports:
      # Router 对外端口（默认 8002）
      - ${ROUTER_PORT:-8002}:8002
    entrypoint: mineru-router
    command:
      --host 0.0.0.0
      --port 8002
      --local-gpus none
      # 下面是 Router 分发到的后端 API 地址（取消注释以添加更多后端）
      --upstream-url http://127.0.0.1:${API_1_PORT:-18000}
      # --upstream-url http://127.0.0.1:${API_2_PORT:-18001}
      # --upstream-url http://127.0.0.1:${API_3_PORT:-18002}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # API 解析服务 1 - 指向已有的 VLM Server（已启用）
  # ===========================================================================
  # 作用：接收文档解析请求，渲染 PDF 为图片，调用 VLM 提取内容
  # 支持的 backend：pipeline / vlm-http-client / hybrid-http-client
  # 访问地址：http://<服务器IP>:18000/docs
  # ===========================================================================
  mineru-api-1:
    image: mineru-full:v1.0
    container_name: mineru-api-1
    restart: always
    ports:
      # API 对外端口（默认 18000）
      - ${API_1_PORT:-18000}:8000
    environment:
      # 远程 VLM 服务器地址（指向已有的 VLM Server）
      MINERU_VL_SERVER: http://${VLM_1_IP:-10.8.132.224}:${VLM_1_PORT:-6002}/v1
      MINERU_VLM_SERVER_URL: http://${VLM_1_IP:-10.8.132.224}:${VLM_1_PORT:-6002}/v1
      # VLM 模型名称（需与 VLM Server 一致）
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}
      # 每个窗口处理的页数（越小单次内存占用越低，处理越频繁）
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-32}
      # 最大并发请求数（越大并行处理能力越强，但会竞争 VLM 资源）
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-3}
      # 启用公式解析（true/false）
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}
      # 启用表格解析（true/false）
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}
      # 日志级别：DEBUG / INFO / WARNING / ERROR
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
      # 允许 HTTP 客户端后端（vlm-http-client 需要）
      --allow-public-http-client
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

