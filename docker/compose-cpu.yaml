services:
  mineru-api:
    build:
      context: .
      dockerfile: china/Dockerfile.cpu-arm
    image: mineru-cpu:v1.0
    container_name: mineru-api
    restart: always
    profiles: ["api"]
    ports:
      # API 服务端口（默认：18000）
      - ${MINERU_API_PORT:-18000}:8000
    environment:
      # ========== VLM 服务配置 ==========
      # 远程 VLM 模型服务地址（使用 vlm-http-client 后端时必填）
      MINERU_VL_SERVER: ${MINERU_VL_SERVER:-http://10.8.132.224:6002/v1}
      MINERU_VLM_SERVER_URL: ${MINERU_VL_SERVER:-http://10.8.132.224:6002/v1}
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}

      # ========== 性能配置 ==========
      # 每个窗口处理的页数（默认：64，越小单次内存占用越低）
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-64}

      # 最大并发请求数（默认：3，越大并行处理能力越强）
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-3}

      # ========== 功能配置 ==========
      # 启用公式解析（默认：true）
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}

      # 启用表格解析（默认：true）
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}

      # ========== 任务管理 ==========
      # 任务保留时间，单位秒（默认：86400 = 24小时）
      MINERU_API_TASK_RETENTION_SECONDS: ${MINERU_API_TASK_RETENTION_SECONDS:-86400}

      # 任务清理间隔，单位秒（默认：3600 = 1小时）
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: ${MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS:-3600}

      # ========== 日志配置 ==========
      # 日志级别：DEBUG、INFO、WARNING、ERROR（默认：INFO）
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}

      # ========== 高级选项 ==========
      # 输出根目录（默认：./output）
      # MINERU_API_OUTPUT_ROOT: /data/output

      # 启动时预加载 VLM 模型（默认：false）
      # MINERU_API_ENABLE_VLM_PRELOAD: false

      # 禁用访问日志（默认：false）
      # MINERU_API_DISABLE_ACCESS_LOG: false

      # stdin 结束时关闭服务（默认：false）
      # MINERU_API_SHUTDOWN_ON_STDIN_EOF: false
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
      --allow-public-http-client
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
