services:
  mineru-openai-server:
    build:
      context: .
      dockerfile: china/npu.Dockerfile
    image: mineru-npu:v1.0
    container_name: mineru-openai-server
    restart: always
    profiles: ["openai-server"]
    ports:
      # VLM 推理服务端口（默认：30000）
      - ${MINERU_VLM_PORT:-30000}:30000
    environment:
      # ========== 模型配置 ==========
      # 模型来源：local / modelscope / huggingface（默认：local）
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}

      # VLM 模型路径（默认：OpenDataLab/MinerU2.5-Pro-2604-1.2B）
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}

      # ========== 性能配置 ==========
      # GPU/NPU 显存利用率（默认：0.9）
      # 越大 = KV 缓存越大 = 并发能力越强
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}

      # 最大序列长度（默认：跟随模型配置）
      # VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-8192}

      # 多 NPU 张量并行数（默认：1）
      # VLLM_TENSOR_PARALLEL_SIZE: ${VLLM_TENSOR_PARALLEL_SIZE:-1}

      # ========== 日志配置 ==========
      # 日志级别：DEBUG、INFO、WARNING、ERROR（默认：INFO）
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}

      # ========== 昇腾 NPU 专属配置 ==========
      # 禁用 torch NPU 异步（调试时使用）
      # ASCEND_LAUNCH_BLOCKING: 1

      # OMP 线程数（默认：1，vllm 推荐）
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    entrypoint: mineru-openai-server
    command:
      --host 0.0.0.0
      --port 30000
      # --gpu-memory-utilization 0.9  # 按需覆盖显存利用率
      # --model /path/to/custom/model  # 按需覆盖自定义模型路径
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
