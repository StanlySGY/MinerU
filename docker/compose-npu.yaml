services:
  mineru-openai-server:
    build:
      context: .
      dockerfile: china/npu.Dockerfile
    image: mineru-npu:v1.0
    container_name: mineru-openai-server
    restart: always
    profiles: ["openai-server"]
    ports:
      # VLM inference server port (default: 30000)
      - ${MINERU_VLM_PORT:-30000}:30000
    environment:
      # ========== Model Configuration ==========
      # Model source: local / modelscope / huggingface (default: local)
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}

      # VLM model path (default: OpenDataLab/MinerU2.5-2509-1.2B)
      # Override for custom model: OpenDataLab/MinerU2.5-Pro-2604-1.2B
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-2509-1.2B}

      # ========== Performance Configuration ==========
      # GPU/NPU memory utilization ratio (default: 0.9)
      # Higher = more memory for KV cache = better concurrency
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}

      # Max sequence length (default: model dependent)
      # VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-8192}

      # Tensor parallel size for multi-NPU (default: 1)
      # VLLM_TENSOR_PARALLEL_SIZE: ${VLLM_TENSOR_PARALLEL_SIZE:-1}

      # ========== Logging ==========
      # Log level: DEBUG, INFO, WARNING, ERROR (default: INFO)
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}

      # ========== Ascend NPU Specific ==========
      # Disable torch NPU async (if needed)
      # ASCEND_LAUNCH_BLOCKING: 1

      # OMP threads (default: 1 for vllm)
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    entrypoint: mineru-openai-server
    command:
      --host 0.0.0.0
      --port 30000
      # --gpu-memory-utilization 0.9  # Override if needed
      # --model /path/to/custom/model  # Override for custom model path
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
