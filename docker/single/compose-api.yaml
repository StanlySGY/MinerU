# =============================================================================
# MinerU API Server - 支持三种 backend
# =============================================================================
# pipeline / vlm-http-client / hybrid-http-client

services:
  mineru-api:
    image: mineru-full:v1.0
    container_name: mineru-api
    restart: always
    ports:
      - ${API_PORT:-18000}:8000
    environment:
      MINERU_VL_SERVER: http://${VLM_SERVER_IP:-127.0.0.1}:${VLM_PORT:-30000}/v1
      MINERU_VLM_SERVER_URL: http://${VLM_SERVER_IP:-127.0.0.1}:${VLM_PORT:-30000}/v1
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-32}
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-3}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE:-true}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE:-true}
      MINERU_LOG_LEVEL: ${MINERU_LOG_LEVEL:-INFO}
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
      --allow-public-http-client
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
