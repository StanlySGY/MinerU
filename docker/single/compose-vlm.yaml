services:
  mineru-code-sync:
    image: ${MINERU_CODE_IMAGE:-mineru-code:v1.0}
    container_name: mineru-code-sync-vlm
    restart: "no"
    volumes:
      - mineru-code:/target

  mineru-vlm:
    image: ${MINERU_VLM_IMAGE:-mineru-server:v1.0}
    container_name: mineru-vlm
    restart: always
    depends_on:
      mineru-code-sync:
        condition: service_completed_successfully
    ports:
      - "${VLM_PORT:-30000}:30000"
    environment:
      PYTHONPATH: /app
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}
      MINERU_VLM_MODEL: ${MINERU_VLM_MODEL:-OpenDataLab/MinerU2.5-Pro-2604-1.2B}
      ASCEND_VISIBLE_DEVICES: ${ASCEND_DEVICE:-0}
      ASCEND_RT_VISIBLE_DEVICES: ${ASCEND_DEVICE:-0}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    volumes:
      - mineru-code:/app:ro
      - ${VLM_MODEL_HOST_PATH:-./models}:${VLM_MODEL_PATH:-/models/mineru}:ro
    entrypoint: ["python", "-m"]
    command:
      - mineru.cli.vlm_server
      - --engine
      - ${VLM_ENGINE:-auto}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --model
      - ${VLM_MODEL_PATH:-/models/mineru}
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  mineru-code:
    name: ${MINERU_CODE_VOLUME:-mineru-code}
