<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MinerU 运维控制台</title>
  <link rel="stylesheet" href="/assets/ops.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">MU</span>
        <div><strong>MinerU</strong><small>运维控制台</small></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">总览</button>
        <button class="nav-item" data-view="services">服务</button>
        <button class="nav-item" data-view="tasks">任务</button>
        <button class="nav-item" data-view="batch">批量测试</button>
        <button class="nav-item" data-view="logs">日志</button>
      </nav>
      <div class="sidebar-foot">
        <span id="connection-dot" class="dot unknown"></span>
        <span id="connection-text">正在连接</span>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">总览</h1>
          <p id="page-meta">最后更新：-</p>
        </div>
        <div class="top-actions">
          <label class="token-field">
            <span>管理令牌</span>
            <input id="token" type="password" autocomplete="off" placeholder="未配置">
          </label>
          <button id="refresh" class="icon-button" title="刷新" aria-label="刷新">↻</button>
        </div>
      </header>

      <section id="notice" class="notice hidden"></section>

      <section id="view-overview" class="view active">
        <div id="summary-strip" class="summary-strip"></div>
        <div class="section-heading"><h2>服务状态</h2><span id="overview-health-count"></span></div>
        <div id="overview-services" class="service-grid"></div>
        <div class="two-column">
          <section class="panel">
            <div class="section-heading"><h2>进行中的任务</h2><button data-go="tasks" class="text-button">查看全部</button></div>
            <div id="overview-tasks" class="table-wrap"></div>
          </section>
          <section class="panel">
            <div class="section-heading"><h2>最近批量测试</h2><button data-go="batch" class="text-button">查看全部</button></div>
            <div id="overview-batches" class="table-wrap"></div>
          </section>
        </div>
      </section>

      <section id="view-services" class="view">
        <div class="toolbar">
          <div class="segmented" id="service-filter">
            <button class="active" data-filter="all">全部</button>
            <button data-filter="router">Router</button>
            <button data-filter="api">API</button>
            <button data-filter="vlm">VLM</button>
          </div>
          <div class="actions stack-actions">
            <button class="secondary-button" data-system-action="test">全链路测试</button>
            <button class="secondary-button" data-system-action="start">启动业务服务</button>
            <button class="secondary-button" data-system-action="restart">重启业务服务</button>
            <button class="secondary-button danger" data-system-action="stop">停止业务服务</button>
          </div>
        </div>
        <div id="services-table" class="table-wrap panel"></div>
      </section>

      <section id="view-tasks" class="view">
        <div class="toolbar">
          <select id="task-status">
            <option value="">全部状态</option>
            <option value="pending">等待中</option>
            <option value="processing">处理中</option>
            <option value="completed">已完成</option>
            <option value="failed">失败</option>
          </select>
          <input id="task-search" type="search" placeholder="任务 ID 或文件名">
        </div>
        <div class="split-view">
          <div id="tasks-table" class="table-wrap panel"></div>
          <aside id="task-detail" class="detail-panel"><div class="empty-state">选择一个任务</div></aside>
        </div>
      </section>

      <section id="view-batch" class="view">
        <section class="form-band">
          <form id="batch-form">
            <div id="upload-drop-zone" class="upload-drop-zone" tabindex="0">
              <strong>拖拽 PDF 文件或文件夹到这里</strong>
              <span>也可以使用下方按钮选择；一次选择会作为一个批量任务</span>
              <div class="actions">
                <button id="choose-files" type="button" class="secondary-button">选择 PDF 文件</button>
                <button id="choose-folder" type="button" class="secondary-button">选择文件夹</button>
                <button id="clear-upload" type="button" class="text-button hidden">清空选择</button>
              </div>
              <input id="batch-files" class="hidden" type="file" accept=".pdf,application/pdf" multiple>
              <input id="batch-folder" class="hidden" type="file" accept=".pdf,application/pdf" webkitdirectory directory multiple>
              <div id="upload-file-list" class="upload-file-list"></div>
            </div>
            <div id="upload-summary" class="upload-summary muted">当前使用服务器测试目录</div>
            <label class="server-directory"><span>服务器测试目录</span><input name="input_path" value="."><small>没有上传浏览器文件时使用</small></label>
            <label><span>后端</span>
              <select name="backend">
                <option value="vlm-http-client">vlm-http-client</option>
                <option value="hybrid-http-client">hybrid-http-client</option>
                <option value="pipeline">pipeline</option>
              </select>
            </label>
            <label><span>语言</span><input name="lang" value="ch"></label>
            <label><span>控制台等待上限（秒）</span><input name="task_timeout" type="number" value="7200" min="60"><small>达到上限只停止诊断脚本等待，不会取消 MinerU 后台任务</small></label>
            <label><span>VLM 单次请求超时（秒）</span><input name="page_timeout_seconds" type="number" value="600" min="1" max="7200" step="1"><small>用于测试异常页真实处理时长；底层 HTTP 硬超时必须不小于此值</small></label>
            <label><span>连接错误重试次数</span><input name="page_connect_max_retries" type="number" value="0" min="0" max="3"><small>耗时基准测试建议保持 0</small></label>
            <label><span>VLM micro-batch 页数</span><input name="vlm_batch_size" type="number" value="1" min="1" max="16"><small>可尝试 2 或 4；批处理失败时会自动逐页隔离</small></label>
            <label class="server-url"><span>VLM Server URL</span><input name="server_url" placeholder="可选，例如 http://10.0.0.8:30000"></label>
            <label class="check-label"><input name="recursive" type="checkbox" checked><span>包含子目录</span></label>
            <button id="batch-submit" type="submit" class="primary-button">开始测试</button>
          </form>
        </section>
        <div class="section-heading"><h2>测试记录</h2><span id="batch-storage">默认串行提交 PDF</span></div>
        <div id="batch-table" class="table-wrap panel"></div>
      </section>

      <section id="view-logs" class="view">
        <div class="toolbar log-toolbar">
          <select id="log-service"></select>
          <select id="log-tail"><option value="200">最近 200 行</option><option value="500">最近 500 行</option><option value="1000">最近 1000 行</option><option value="2000">最近 2000 行</option></select>
          <label class="inline-check"><input id="log-live" type="checkbox" checked><span>动态刷新</span></label>
          <label class="inline-check"><input id="log-follow" type="checkbox" checked><span>跟随最新</span></label>
          <button id="load-logs" class="secondary-button">立即刷新</button>
          <span id="log-status" class="log-status muted">请选择服务</span>
        </div>
        <pre id="log-output" class="log-output service-log-output" tabindex="0">请选择服务。</pre>
      </section>
    </main>
  </div>

  <dialog id="batch-detail-dialog" class="batch-dialog">
    <header class="dialog-header">
      <div><h2 id="batch-detail-title">批量任务详情</h2><p id="batch-detail-meta" class="muted"></p></div>
      <button id="close-batch-detail" type="button" class="secondary-button">关闭</button>
    </header>
    <div class="dialog-actions document-toolbar">
      <div class="segmented" id="batch-document-tabs">
        <button type="button" data-batch-document="markdown">诊断报告</button>
        <button type="button" data-batch-document="process_markdown">过程日志</button>
      </div>
      <div class="actions">
        <button id="export-current-batch-document" type="button" class="secondary-button">导出当前内容</button>
        <button type="button" class="primary-button" data-active-problem-pages-retry>重试异常页</button>
        <button type="button" class="secondary-button" data-dialog-export="problem_pages">导出异常页 PDF</button>
        <button type="button" class="secondary-button" data-dialog-export="zip">导出完整 ZIP</button>
      </div>
    </div>
    <article id="batch-document-preview" class="markdown-preview batch-document-preview"><div class="empty-state">正在读取...</div></article>
  </dialog>

  <dialog id="problem-pages-retry-dialog" class="problem-pages-retry-dialog">
    <header class="dialog-header">
      <div><h2>重试异常页</h2><p id="problem-pages-retry-meta" class="muted"></p></div>
      <button id="close-problem-pages-retry" type="button" class="secondary-button">关闭</button>
    </header>
    <form id="problem-pages-retry-form" class="problem-pages-retry-form">
      <input name="run_id" type="hidden">
      <p class="retry-explanation">系统会从原 PDF 中截取状态为“跳过”或“失败”的页面，创建一个新的批次。原批次和原文件不会被修改。</p>
      <label><span>VLM 单次请求超时（秒）</span><input name="page_timeout_seconds" type="number" value="1200" min="1" max="7200" step="1" required><small>例如原来 600 秒超时，可改成 1200 秒继续测试；不能超过底层 HTTP 硬超时。</small></label>
      <label><span>控制台等待上限（秒）</span><input name="task_timeout" type="number" value="7200" min="60" max="86400" step="1" required><small>提交时会自动保证至少比单页超时多 60 秒；达到上限不会取消 MinerU 后台任务。</small></label>
      <label><span>连接错误重试次数</span><input name="page_connect_max_retries" type="number" value="0" min="0" max="3" step="1" required><small>测量这一页真实处理时间时建议保持 0，避免重试耗时干扰结果。</small></label>
      <label><span>VLM micro-batch 页数</span><input name="vlm_batch_size" type="number" value="1" min="1" max="16" step="1" required><small>异常页专项测试建议保持 1，以便准确观察每一页耗时。</small></label>
      <div class="retry-dialog-actions">
        <button id="cancel-problem-pages-retry" type="button" class="secondary-button">取消</button>
        <button id="submit-problem-pages-retry" type="submit" class="primary-button">截取并开始重试</button>
      </div>
    </form>
  </dialog>

  <dialog id="task-preview-dialog" class="batch-dialog task-preview-dialog">
    <header class="dialog-header">
      <div><h2 id="task-preview-title">任务结果预览</h2><p id="task-preview-meta" class="muted"></p></div>
      <button id="close-task-preview" type="button" class="secondary-button">关闭</button>
    </header>
    <div class="dialog-actions document-toolbar">
      <label class="inline-check"><input id="task-preview-sync" type="checkbox" checked><span>同步滚动</span></label>
      <div class="actions">
        <button id="download-task-original" type="button" class="secondary-button">下载原始 PDF</button>
        <button id="download-task-result" type="button" class="secondary-button">下载结果 ZIP</button>
      </div>
    </div>
    <div class="task-compare-grid">
      <section class="task-compare-pane">
        <div class="preview-heading"><h3>原始 PDF</h3><span id="task-pdf-page-count" class="muted"></span></div>
        <div id="task-original-pages" class="task-synced-scroll task-pdf-pages"></div>
      </section>
      <section class="task-compare-pane">
        <div class="preview-heading"><h3>Markdown 提取结果</h3><span id="task-preview-status" class="muted"></span></div>
        <article id="task-result-preview" class="markdown-preview task-synced-scroll"><div class="empty-state">正在读取...</div></article>
      </section>
    </div>
  </dialog>
  <script src="/assets/ops.js"></script>
</body>
</html>
